name: seed-dns-rebinding

hosts:
  - name: attacker
    base_box:
      image: seed
      mgmt_user: debian
    flavor: m1.medium

  - name: local-dns
    base_box:
      image: seed
      mgmt_user: debian
    flavor: m1.medium

  - name: victim-iot
    base_box:
      image: seed
      mgmt_user: debian
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: internal-switch
    cidr: 10.1.26.0/24
    accessible_by_user: True
  - name: attacker-switch
    cidr: 10.1.27.0/24
    accessible_by_user: True

net_mappings:
  - host: attacker
    network: attacker-switch
    ip: 10.1.27.23

  - host: local-dns
    network: internal-switch
    ip: 10.1.26.10

  - host: victim-iot
    network: internal-switch
    ip: 10.1.26.4

router_mappings:
  - router: router
    network: internal-switch
    ip: 10.1.26.1
  - router: router
    network: attacker-switch
    ip: 10.1.27.1

groups: []
