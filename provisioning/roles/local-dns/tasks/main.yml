---
- name: Install BIND9 DNS server
  apt:
    name:
      - bind9
      - bind9utils
      - bind9-doc
    state: present
    update_cache: yes

- name: Deploy named.conf.options
  template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: bind
    group: bind
    mode: '0644'
  notify: Restart bind9

- name: Deploy named.conf.local with forward zone
  template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: bind
    group: bind
    mode: '0644'
  notify: Restart bind9

- name: Ensure BIND9 service is started and enabled
  service:
    name: bind9
    state: started
    enabled: yes
